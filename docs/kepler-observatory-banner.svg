    <radialGradient id="nebula"><stop stop-color="#0b7490" stop-opacity=".40"/><stop offset="1" stop-color="#07111e" stop-opacity="0"/></radialGradient>
    <radialGradient id="star"><stop offset="0" stop-color="#fff8d9"/><stop offset=".34" stop-color="#ffd77f"/><stop offset=".7" stop-color="#ff923e"/><stop offset="1" stop-color="#ff6b37" stop-opacity="0"/></radialGradient>
