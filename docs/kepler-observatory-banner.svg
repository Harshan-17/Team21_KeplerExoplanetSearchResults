<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Kepler Observatory — Transit intelligence and AI research</title>
<desc id="desc">Custom dark science dashboard artwork emphasizing a predicted exoplanet transit countdown, Kepler AI research assistant, candidate screening, and scientific data insights. All displayed countdown digits and chat text are illustrative.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050a17"/><stop offset=".58" stop-color="#081a2c"/><stop offset="1" stop-color="#02050b"/></linearGradient>
  <radialGradient id="nebula"><stop stop-color="#0b7890" stop-opacity=".35"/><stop offset="1" stop-color="#08111e" stop-opacity="0"/></radialGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#32e4d2"/><stop offset="1" stop-color="#419cff"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b2434"/><stop offset="1" stop-color="#081422"/></linearGradient>
  <radialGradient id="planet" cx=".28" cy=".22" r=".78"><stop stop-color="#b2fff2"/><stop offset=".24" stop-color="#3ad5d2"/><stop offset=".7" stop-color="#147ea9"/><stop offset="1" stop-color="#0b1b3e"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1200" height="420" rx="24" fill="url(#bg)"/>
<ellipse cx="835" cy="207" rx="410" ry="285" fill="url(#nebula)"/>
<g fill="#e8faff" opacity=".63"><circle cx="42" cy="72" r="1.3"/><circle cx="118" cy="340" r="1"/><circle cx="251" cy="46" r="1.5"/><circle cx="409" cy="362" r="1.2"/><circle cx="510" cy="55" r="1"/><circle cx="743" cy="44" r="1.1"/><circle cx="900" cy="28" r="1.4"/><circle cx="1122" cy="53" r="1.2"/><circle cx="1154" cy="355" r="1"/><circle cx="635" cy="387" r="1.1"/><circle cx="78" cy="220" r="1.2"/><circle cx="1085" cy="292" r="1.4"/></g>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="58" y="58" font-size="12" font-weight="700" letter-spacing="3" fill="#67ede4">KEPLER MISSION DATA · TEAM 21</text>
  <text x="56" y="126" font-size="49" font-weight="800" letter-spacing="-1.4" fill="#f1f9ff">KEPLER</text>
  <text x="56" y="180" font-size="49" font-weight="800" letter-spacing="-1.4" fill="#f1f9ff">OBSERVATORY</text>
  <rect x="59" y="203" width="58" height="3" rx="1.5" fill="url(#cyan)"/>
  <text x="58" y="237" font-size="17" fill="#bdd4e4">Transit intelligence. AI-assisted discovery.</text>
  <text x="58" y="263" font-size="14" fill="#87a5bb">Follow predicted events · Investigate candidates · Understand the data</text>
  <g transform="translate(58 305)">
    <rect width="144" height="33" rx="16.5" fill="#092c38" stroke="#208b9a" stroke-opacity=".8"/>
    <text x="72" y="21" font-size="10.5" font-weight="700" text-anchor="middle" fill="#9bfff1">LIVE COUNTDOWN</text>
    <rect x="154" width="116" height="33" rx="16.5" fill="#092c38" stroke="#208b9a" stroke-opacity=".8"/>
    <text x="212" y="21" font-size="10.5" font-weight="700" text-anchor="middle" fill="#9bfff1">KEPLER AI</text>
    <rect x="280" width="146" height="33" rx="16.5" fill="#092c38" stroke="#208b9a" stroke-opacity=".8"/>
    <text x="353" y="21" font-size="10.5" font-weight="700" text-anchor="middle" fill="#9bfff1">SCIENTIFIC INSIGHTS</text>
  </g>

  <!-- Countdown panel -->
  <rect x="537" y="50" width="374" height="300" rx="16" fill="url(#panel)" stroke="#1d5063"/>
  <text x="558" y="77" font-size="10" font-weight="700" letter-spacing="1.8" fill="#65e6df">TRANSIT TELEMETRY</text>
  <text x="558" y="103" font-size="18" font-weight="700" fill="#edfaff">NEXT PREDICTED TRANSIT</text>
  <text x="558" y="123" font-size="11" fill="#85a5b9">Selected KOI · ephemeris-based prediction</text>
  <rect x="557" y="140" width="334" height="88" rx="11" fill="#061622" stroke="#205063"/>
  <g fill="#f0faff" text-anchor="middle"><text x="601" y="177" font-size="28" font-weight="750">02</text><text x="601" y="200" font-size="9" fill="#7fa8bc">DAYS</text><text x="684" y="177" font-size="28" font-weight="750">14</text><text x="684" y="200" font-size="9" fill="#7fa8bc">HOURS</text><text x="767" y="177" font-size="28" font-weight="750">38</text><text x="767" y="200" font-size="9" fill="#7fa8bc">MIN</text><text x="850" y="177" font-size="28" font-weight="750">09</text><text x="850" y="200" font-size="9" fill="#7fa8bc">SEC</text></g>
  <g stroke="#214454"><path d="M642 151v61M725 151v61M808 151v61"/></g>
  <rect x="558" y="245" width="96" height="25" rx="12.5" fill="#09332e" stroke="#168274"/>
  <circle cx="572" cy="257.5" r="3.5" fill="#60f0c8"/><text x="582" y="261" font-size="10" font-weight="700" fill="#94ffdd">UPCOMING</text>
  <text x="558" y="294" font-size="11" fill="#90aabb">tₙ = t₀ + nP</text><text x="558" y="314" font-size="10" fill="#66899e">Concept illustration · not live telemetry</text>

  <!-- AI panel -->
  <rect x="930" y="50" width="222" height="300" rx="16" fill="#081827" stroke="#1c4a5f"/>
  <circle cx="954" cy="76" r="6" fill="url(#cyan)"/>
  <text x="968" y="80" font-size="12" font-weight="700" fill="#eaf8ff">KEPLER AI</text>
  <text x="948" y="108" font-size="10" letter-spacing="1.2" font-weight="700" fill="#67e7df">ASK YOUR DATA</text>
  <rect x="947" y="122" width="187" height="54" rx="9" fill="#101f31" stroke="#273e52"/>
  <text x="959" y="143" font-size="10.5" fill="#dceaf5">What does transit</text><text x="959" y="158" font-size="10.5" fill="#dceaf5">depth tell us?</text>
  <rect x="947" y="188" width="187" height="91" rx="9" fill="#0a2a36" stroke="#1a5e6d"/>
  <text x="959" y="210" font-size="10.5" font-weight="700" fill="#8cf5e7">Research response</text>
  <text x="959" y="231" font-size="9.5" fill="#b9d2e0">Explain parameters,</text><text x="959" y="246" font-size="9.5" fill="#b9d2e0">compare candidates,</text><text x="959" y="261" font-size="9.5" fill="#b9d2e0">and interpret results.</text>
  <text x="948" y="315" font-size="9.5" fill="#698da2">Grounded in available data</text>
  <text x="1149" y="390" font-size="9" letter-spacing="1.3" fill="#4c7488" text-anchor="end">VISUAL CONCEPT · NOT A LIVE SCREENSHOT</text>
</g>
</svg>