<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Kepler Observatory — Explore distant worlds</title>
  <desc id="desc">A dark-space scientific dashboard illustration with a glowing host star, orbital ring, orbiting blue-green exoplanet, and cyan telemetry motifs.</desc>
  <defs>
