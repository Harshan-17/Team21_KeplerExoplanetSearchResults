<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
<title id="title">Kepler AI research assistant concept</title>
<desc id="desc">A dark astronomical research assistant interface with a user question, a concise answer area, a cited candidate data card, and scientific telemetry chips. Text is illustrative, not a live AI response.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06111f"/><stop offset="1" stop-color="#02060d"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#2ce1d1"/><stop offset="1" stop-color="#4b9aff"/></linearGradient>
  <linearGradient id="bubble" x2="1" y2="1"><stop stop-color="#0d3040"/><stop offset="1" stop-color="#0b1c2d"/></linearGradient>
</defs>
<rect x="1" y="1" width="898" height="328" rx="18" fill="url(#bg)" stroke="#1d4557"/>
<circle cx="846" cy="57" r="110" fill="#064c70" opacity=".1"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <rect x="22" y="20" width="856" height="44" rx="10" fill="#081c2a" stroke="#1c4055"/>
  <circle cx="44" cy="42" r="6" fill="#45e6d7"/>
  <text x="61" y="46" fill="#e8f6ff" font-size="13" font-weight="700">KEPLER AI</text>
  <text x="153" y="46" fill="#7895aa" font-size="11">Research assistant · data-grounded explanations</text>
  <rect x="726" y="31" width="132" height="22" rx="11" fill="#0a332f" stroke="#167f79"/>
  <text x="792" y="45.5" fill="#8af7e0" font-size="10" font-weight="700" text-anchor="middle">SCIENTIFIC CONTEXT</text>

  <text x="28" y="91" fill="#6eece4" font-size="10" font-weight="700" letter-spacing="1.6">YOUR QUESTION</text>
  <rect x="28" y="102" width="555" height="47" rx="11" fill="#101e31" stroke="#29435c"/>
  <text x="45" y="122" fill="#e9f5ff" font-size="13">“What does this candidate’s transit depth tell us</text>
  <text x="45" y="139" fill="#e9f5ff" font-size="13">about the planet?”</text>

  <text x="28" y="174" fill="#6eece4" font-size="10" font-weight="700" letter-spacing="1.6">KEPLER AI · RESPONSE CONCEPT</text>
  <rect x="28" y="186" width="555" height="103" rx="12" fill="url(#bubble)" stroke="#1e5e6d"/>
  <circle cx="49" cy="207" r="7" fill="url(#accent)"/>
  <text x="66" y="211" fill="#9af7ed" font-size="11" font-weight="700">Transit depth is a brightness measurement</text>
  <text x="45" y="235" fill="#d0e2ed" font-size="11.5">It approximates how much starlight is blocked during transit.</text>
  <text x="45" y="253" fill="#d0e2ed" font-size="11.5">Interpret it with stellar radius, transit geometry, and signal</text>
  <text x="45" y="271" fill="#d0e2ed" font-size="11.5">quality. It is not, by itself, proof of planetary confirmation.</text>

  <rect x="604" y="81" width="274" height="208" rx="12" fill="#071b29" stroke="#1c4055"/>
  <text x="620" y="105" fill="#e8f6ff" font-size="12" font-weight="700">Linked research context</text>
  <text x="620" y="122" fill="#7999af" font-size="10">Example candidate card</text>
  <rect x="620" y="136" width="242" height="55" rx="8" fill="#0b2838" stroke="#225368"/>
  <text x="633" y="156" fill="#8ef5e9" font-size="12" font-weight="700">K00087.01</text>
  <text x="633" y="174" fill="#d5e6f0" font-size="11">Kepler-22 b · selected target</text>
  <g>
    <rect x="620" y="202" width="115" height="27" rx="7" fill="#0b2b35" stroke="#1b6571"/>
    <text x="677.5" y="219" fill="#9ef5e8" font-size="10" text-anchor="middle">Transit parameters</text>
    <rect x="746" y="202" width="116" height="27" rx="7" fill="#0b2b35" stroke="#1b6571"/>
    <text x="804" y="219" fill="#9ef5e8" font-size="10" text-anchor="middle">Screening results</text>
  </g>
  <text x="620" y="250" fill="#7e9db2" font-size="10">Answers should use actual records</text>
  <text x="620" y="265" fill="#7e9db2" font-size="10">and disclose unavailable information.</text>
  <text x="862" y="313" fill="#53768c" font-size="9" text-anchor="end" letter-spacing="1.1">CONCEPT VISUAL · NOT A LIVE RESPONSE</text>
</g>
</svg>