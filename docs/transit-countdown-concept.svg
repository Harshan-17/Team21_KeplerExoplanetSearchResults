<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<title id="title">Transit countdown concept</title><desc id="desc">Conceptual telemetry panel depicting a calculated next-transit countdown, orbital ring, and planet silhouette. Values are illustrative, not live observations.</desc>
